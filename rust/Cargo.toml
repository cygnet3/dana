[package]
name = "rust_lib_danawallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
spdk-wallet = { git = "https://github.com/cygnet3/spdk", rev = "01cbea845c9dfe2f63200d580d6ca87b4105eaa7" }
psbt-v2 = { git = "https://gitea.bitcoin.ninja/sosthene/rust-psbt.git", rev = "363721f6ea53b23eb6a88cd81e9c4155a4a46bb6", features = ["silent-payments", "rand", "miniscript"] }
lazy_static = "1.4"
anyhow = "1.0"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
once_cell = "1.18.0"
bip39 = { version = "2.0.0", features = ["rand"] }
serde_with = "3.6.0"
log = "0.4.20"
simplelog = { version = "0.12.1", default-features = false, features = ["local-offset"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
pushtx = "0.4.0"
futures = "0.3"
async-trait = "0.1"
rand = "0.9.0"
base64 = "0.22.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
