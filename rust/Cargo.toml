[package]
name = "rust_lib_danawallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
spdk-wallet = { git = "https://github.com/cygnet3/spdk", branch = "feat/silentpayments-dleq-multisigner" }
psbt-v2 = { git = "https://github.com/Sosthene00/rust-psbt.git", branch = "taproot_sign", features = ["silent-payments", "rand"] }
lazy_static = "1.4"
anyhow = "1.0"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
once_cell = "1.18.0"
bip39 = { version = "2.0.0", features = ["rand"] }
serde_with = "3.6.0"
log = "0.4.20"
simplelog = { version = "0.12.1", default-features = false, features = ["local-offset"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
pushtx = { git = "https://github.com/cygnet3/pushtx", branch = "master" }
futures = "0.3"
async-trait = "0.1"
rand = "0.9.0"
base64 = "0.22.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
