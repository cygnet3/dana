[package]
name = "rust_lib_danawallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# frigate backend branch: event-driven FrigateScanner + reworked scanner/backends
# (E2E-verified against frigate 1.4.1; see Sosthene00/spdk feat/frigate-backend)
spdk-wallet = { git = "https://github.com/Sosthene00/spdk", branch = "feat/frigate-backend" }
frigate = { git = "https://github.com/Sosthene00/spdk", branch = "feat/frigate-backend" }
# keyless tip probe: FrigateClient (connect + block_height) lives in the
# backend-frigate crate; the `frigate` scanner crate does not re-export it
backend-frigate = { git = "https://github.com/Sosthene00/spdk", branch = "feat/frigate-backend" }
# phase-3 electrum confirmation tracking (Sub-C): response types
# (Tx::Confirmed/Mempool) + ElectrumScriptHash. Same rev the frigate backend
# stack already pins (single version in the tree).
electrum_streaming_client = { git = "https://github.com/bitcoindevkit/electrum_streaming_client", rev = "01a6d42aac33f86b2bc647e7fc702067be99c9c7" }
lazy_static = "1.4"
anyhow = "1.0"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
once_cell = "1.18.0"
bip39 = { version = "2.0.0", features = ["rand"] }
serde_with = "3.6.0"
log = "0.4.20"
simplelog = { version = "0.12.1", default-features = false, features = [
  "local-offset",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
pushtx = "0.4.0"
futures = "0.3"
async-trait = "0.1"
rand = "0.9.0"
base64 = "0.22.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
