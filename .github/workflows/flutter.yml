name: Flutter

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: .fvmrc
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib
