name: CI

on:
  pull_request:

jobs:
  flutter_format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: .fvmrc
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib

  flutter_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: .fvmrc
      - run: flutter test
